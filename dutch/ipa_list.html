<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Nederlands woordenlijst met uitspraak (Dutch IPA word list with pronunciation.)" />
    <title>Nederlands - IPA List</title>
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <div class="header">
      <div class="titles">
        <h1>Nederlandse woordenlijst / Dutch IPA List</h1>
        <h2>Nederlands (nl)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="container">
      <div class="row" style="margin-bottom: 15px;">
        <div class="col" style="flex: 0 0 auto;">
          <h5 style="margin: 0;"><a href="./index.html">← <span data-i18n="list_back">Back to Translator</span></a></h5>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <div class="table-responsive">
          <table class="table table-striped display" id="DataTable">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col" data-i18n="list_word_column">Word</th>
                <th scope="col" data-i18n="list_ipa_column">IPA</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
</div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4 data-i18n="list_description">Description</h4>
          <p>Dit open-source project zet Nederlands om naar IPA.</p>

          <h4 style="margin-top:20px" data-i18n="list_links">Links</h4>
          <ul>
            <li><a href="./ipa_list.html">IPA-database</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h4 data-i18n="tools_lang">Other Languages</h4>
          <ul class="lang-list" id="lang-buttons-container">

          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <div class="footer-bottom-inner">
          <select id="locale-select" class="locale-select-btn"></select>
          <p>
          <a href="https://github.com/lotusfa/IPA-Translator" data-i18n="i18n_github">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
        </div>
      </div>
    </footer>

    <script src="../lib/jquery/jquery.min.js"></script>
    <script src="../lib/datatables/datatables.min.js"></script>
    <link rel="stylesheet" type="text/css" href="../lib/datatables/datatables.min.css"/>

    <script type="module">
      import { initIPAListPage } from '../js/page/ipa-list-page.js';

      await initIPAListPage({
        defaultLocale: 'dutch',
        language: 'nl-NL',
        tableJsonPath: '../json/nl.json',
        tableId: 'DataTable',
        enableTTS: true
      });
    </script>
  </body>
</html>
